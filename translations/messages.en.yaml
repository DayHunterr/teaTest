reviews.title: "What our Clients say"
reviews.1.text: "\"As a tea enthusiast, I have tried teas from all over the world, but this tea store truly stands out. Their teas are of the highest quality and the variety is impressive. This is definitely a tea store that every tea lover should visit.\""
reviews.1.author: "Alice"
reviews.2.text: "\"This tea store is my go-to for all my tea needs. Their selection is unbeatable and the quality of their teas is exceptional.\""
reviews.2.author: "Mad-Hatter"
reviews.3.text: "\"If you're a tea lover, you must visit this tea store. The selection is vast and the quality is outstanding. I guarantee you won't be disappointed.\""
reviews.3.author: "Dormouse"
reviews.4.text: "\"I am not a big tea drinker, but this tea store has converted me. I highly recommend this tea store to anyone looking for a high-quality tea experience.\""
reviews.4.author: "March Hare"

