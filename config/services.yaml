# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  locale: '%env(string:LOCALE)%'

services:

  App\Controller\Admin\ArticleAdminController:
    autowire: true
    autoconfigure: false
    public: true
    tags: [ 'controller.service_arguments' ]

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  App\Service\CredentialProvider: ~

  App\ApiNewsClient\GNewsApiClient:
    arguments:
      $credentials: '@App\Service\CredentialProvider'
    tags: ['app.news_client']

  App\ApiNewsClient\MediaStackApiClient:
    arguments:
      $credentials: '@App\Service\CredentialProvider'
    tags: ['app.news_client']

  App\ApiNewsClient\NewsApiApiClient:
    arguments:
      $credentials: '@App\Service\CredentialProvider'
    tags: ['app.news_client']

  App\ApiNewsClient\Resolver\NewsClientResolver:
    $clients: !tagged_iterator app.news_client



  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name

  admin.article:
    class: App\Admin\ArticleAdmin
    tags:
      - { name: sonata.admin, model_class: App\Entity\Article,controller: App\Controller\Admin\ArticleAdminController, manager_type: orm, label: Article, group: Posts, icon: '<i class="fa fa-address-card-o"></i>' }

  App\EventListener\AdminMenuListener:
    tags:
      - { name: kernel.event_listener, event: sonata.admin.event.configure.menu.sidebar }

  sonata.user.admin.user:
    class: App\Admin\UserAdmin
    arguments: [ ~, App\Entity\SonataUserUser, ~ ]
    tags:
      - { name: sonata.admin, manager_type: orm, label: Users, group: Users, icon: '<i class="fa fa-user"></i>' }

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Command\JsonTranslationsDumpCommand:
    arguments:
      - '%kernel.project_dir%/translations'
      - '%kernel.project_dir%/public/translations/translations.json'
      - '%locale%'


