twig:
    form_themes:
        - '@FOSCKEditor/Form/ckeditor_widget.html.twig'
        - '@SonataAdmin/Form/form_admin_fields.html.twig'
fos_ck_editor:
    default_config: default
    configs:
        default:
            toolbar: full
            filebrowserUploadUrl: /admin/ckeditor/upload
            filebrowserUploadMethod: 'form'
#            extraPlugins: "uploadimage"
            removePlugins: exportpdf,uploadimage
            height: 400
        drag_and_drop:
            toolbar: full
            filebrowserUploadUrl: "/admin/ckeditor/upload?responseType=json"
            filebrowserUploadMethod: 'form'
            extraPlugins: "uploadimage"
            removePlugins: exportpdf,uploadimage,clipboard
            height: 400
